[project]
name = "banking-reporting-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
